[project]
name = "eduinsight"
version = "0.1.0"
description = "AI learning assistant for Moodle LMS, powered by Lite-Mem memory"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "lite-mem",
    "fastapi>=0.115.0",
    "uvicorn>=0.34.0",
    "httpx>=0.28.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.7.0",
    "pylti1p3>=2.0.0",
    "python-multipart>=0.0.24",
    "pymupdf>=1.27.2.2",
    "python-pptx>=1.0.2",
    "openpyxl>=3.1.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-httpx>=0.35.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

[tool.uv.sources]
lite-mem = { path = "../memory-bench" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/eduinsight"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
"src/eduinsight/demo_data.py" = ["E501"]
"src/eduinsight/demo_conversations.py" = ["E501"]
"src/eduinsight/demo_materials.py" = ["E501"]
"src/eduinsight/semester_demo.py" = ["E501"]
"scripts/seed_conversations.py" = ["E501"]
"scripts/seed_demo.py" = ["E501"]
"scripts/seed_rich_demo.py" = ["E501"]
"scripts/setup_lti_config.py" = ["E501"]
