<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EduInsight - AI 學習助教</title>
<style>
  :root {
    --bg: #f5f7fa;
    --surface: #ffffff;
    --primary: #4f46e5;
    --primary-hover: #4338ca;
    --text: #1e293b;
    --text-muted: #64748b;
    --border: #e2e8f0;
    --user-bg: #eef2ff;
    --assistant-bg: #f0fdf4;
    --memory-bg: #fffbeb;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* Header */
  header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 12px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
  }
  header h1 {
    font-size: 18px;
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  header h1 span { font-size: 22px; }
  .header-controls {
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: 13px;
    color: var(--text-muted);
  }
  .header-controls label { font-weight: 500; }
  .header-controls input, .header-controls select {
    padding: 4px 8px;
    border: 1px solid var(--border);
    border-radius: 6px;
    font-size: 13px;
    background: var(--bg);
  }
  .header-controls input:focus, .header-controls select:focus {
    outline: none;
    border-color: var(--primary);
  }
  #status-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #22c55e;
    display: inline-block;
  }
  #status-dot.offline { background: #ef4444; }

  /* Chat area */
  #chat-area {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  .msg {
    max-width: 720px;
    padding: 12px 16px;
    border-radius: 12px;
    line-height: 1.6;
    font-size: 14px;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .msg.user {
    background: var(--user-bg);
    align-self: flex-end;
    border-bottom-right-radius: 4px;
  }
  .msg.assistant {
    background: var(--assistant-bg);
    align-self: flex-start;
    border-bottom-left-radius: 4px;
  }
  .msg .role {
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    color: var(--text-muted);
    margin-bottom: 4px;
  }
  .msg.user .role { color: var(--primary); }
  .msg.assistant .role { color: #16a34a; }

  /* Memory context toggle */
  .memory-toggle {
    font-size: 12px;
    color: var(--text-muted);
    cursor: pointer;
    margin-top: 8px;
    user-select: none;
  }
  .memory-toggle:hover { color: var(--primary); }
  .memory-list {
    display: none;
    margin-top: 6px;
    padding: 8px 12px;
    background: var(--memory-bg);
    border-radius: 8px;
    font-size: 12px;
    color: var(--text-muted);
    line-height: 1.5;
  }
  .memory-list.open { display: block; }
  .memory-list li { margin-bottom: 4px; }

  /* Typing indicator */
  .typing {
    align-self: flex-start;
    padding: 12px 16px;
    background: var(--assistant-bg);
    border-radius: 12px;
    border-bottom-left-radius: 4px;
    font-size: 14px;
    color: var(--text-muted);
  }
  .typing .dots span {
    animation: blink 1.4s infinite both;
    font-size: 18px;
  }
  .typing .dots span:nth-child(2) { animation-delay: 0.2s; }
  .typing .dots span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes blink {
    0%, 80%, 100% { opacity: 0.3; }
    40% { opacity: 1; }
  }

  /* Welcome */
  .welcome {
    text-align: center;
    margin: auto;
    color: var(--text-muted);
    max-width: 480px;
  }
  .welcome h2 { font-size: 20px; color: var(--text); margin-bottom: 8px; }
  .welcome p { font-size: 14px; line-height: 1.6; }
  .welcome .hints {
    margin-top: 16px;
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    justify-content: center;
  }
  .welcome .hint {
    padding: 6px 14px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px;
    font-size: 13px;
    cursor: pointer;
    transition: border-color 0.15s;
  }
  .welcome .hint:hover { border-color: var(--primary); color: var(--primary); }

  /* Input bar */
  #input-bar {
    flex-shrink: 0;
    background: var(--surface);
    border-top: 1px solid var(--border);
    padding: 12px 20px;
    display: flex;
    gap: 8px;
    align-items: flex-end;
  }
  #msg-input {
    flex: 1;
    padding: 10px 14px;
    border: 1px solid var(--border);
    border-radius: 10px;
    font-size: 14px;
    font-family: inherit;
    resize: none;
    max-height: 120px;
    line-height: 1.5;
  }
  #msg-input:focus { outline: none; border-color: var(--primary); }
  #send-btn {
    padding: 10px 20px;
    background: var(--primary);
    color: #fff;
    border: none;
    border-radius: 10px;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    transition: background 0.15s;
    white-space: nowrap;
  }
  #send-btn:hover { background: var(--primary-hover); }
  #send-btn:disabled { opacity: 0.5; cursor: not-allowed; }
</style>
</head>
<body>

<header>
  <h1><span>&#x1F393;</span> EduInsight</h1>
  <div class="header-controls">
    <label for="user-id">Student ID</label>
    <input type="number" id="user-id" value="1" min="1" style="width:64px">
    <label for="topic">Topic</label>
    <input type="text" id="topic" placeholder="(optional)" style="width:120px">
    <a href="/demo" style="color:var(--primary);text-decoration:none;font-weight:500;font-size:13px">Demo</a>
    <span id="status-dot" title="API status"></span>
  </div>
</header>

<div id="chat-area">
  <div class="welcome" id="welcome">
    <h2>Hi! I'm your AI learning assistant.</h2>
    <p>Ask me about your coursework, concepts you're struggling with, or anything academic. I'll remember our conversations to help you better over time.</p>
    <div class="hints">
      <div class="hint" onclick="fillHint(this)">What is polymorphism?</div>
      <div class="hint" onclick="fillHint(this)">Explain recursion simply</div>
      <div class="hint" onclick="fillHint(this)">Help me with linked lists</div>
    </div>
  </div>
</div>

<div id="input-bar">
  <textarea id="msg-input" rows="1" placeholder="Type your question..." autofocus></textarea>
  <button id="send-btn" onclick="sendMessage()">Send</button>
</div>

<script>
const chatArea = document.getElementById('chat-area');
const msgInput = document.getElementById('msg-input');
const sendBtn  = document.getElementById('send-btn');
const welcome  = document.getElementById('welcome');
const statusDot = document.getElementById('status-dot');

// Auto-resize textarea
msgInput.addEventListener('input', () => {
  msgInput.style.height = 'auto';
  msgInput.style.height = Math.min(msgInput.scrollHeight, 120) + 'px';
});

// Enter to send (Shift+Enter for newline)
msgInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
});

function fillHint(el) {
  msgInput.value = el.textContent;
  msgInput.focus();
}

function scrollToBottom() {
  chatArea.scrollTop = chatArea.scrollHeight;
}

function addMessage(role, text, memoryContext) {
  if (welcome) welcome.remove();

  const div = document.createElement('div');
  div.className = `msg ${role}`;

  const roleLabel = document.createElement('div');
  roleLabel.className = 'role';
  roleLabel.textContent = role === 'user' ? 'You' : 'EduInsight';
  div.appendChild(roleLabel);

  const body = document.createElement('div');
  body.textContent = text;
  div.appendChild(body);

  // Memory context (assistant messages only)
  if (role === 'assistant' && memoryContext && memoryContext.length > 0) {
    const toggle = document.createElement('div');
    toggle.className = 'memory-toggle';
    toggle.textContent = `Memory context used (${memoryContext.length})`;
    const list = document.createElement('ul');
    list.className = 'memory-list';
    memoryContext.forEach(m => {
      const li = document.createElement('li');
      li.textContent = m;
      list.appendChild(li);
    });
    toggle.addEventListener('click', () => list.classList.toggle('open'));
    div.appendChild(toggle);
    div.appendChild(list);
  }

  chatArea.appendChild(div);
  scrollToBottom();
}

function showTyping() {
  const div = document.createElement('div');
  div.className = 'typing';
  div.id = 'typing-indicator';
  div.innerHTML = '<div class="dots"><span>.</span><span>.</span><span>.</span></div>';
  chatArea.appendChild(div);
  scrollToBottom();
}

function hideTyping() {
  const el = document.getElementById('typing-indicator');
  if (el) el.remove();
}

async function sendMessage() {
  const text = msgInput.value.trim();
  if (!text) return;

  const userId = parseInt(document.getElementById('user-id').value) || 1;
  const topic = document.getElementById('topic').value.trim();

  // Show user message
  addMessage('user', text);
  msgInput.value = '';
  msgInput.style.height = 'auto';
  sendBtn.disabled = true;
  showTyping();

  try {
    const res = await fetch('/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        moodle_user_id: userId,
        message: text,
        topic: topic,
      }),
    });

    hideTyping();

    if (!res.ok) {
      const err = await res.text();
      addMessage('assistant', `Error: ${res.status} - ${err}`);
      return;
    }

    const data = await res.json();
    addMessage('assistant', data.reply, data.memory_context);
  } catch (e) {
    hideTyping();
    addMessage('assistant', `Connection error: ${e.message}`);
    statusDot.classList.add('offline');
  } finally {
    sendBtn.disabled = false;
    msgInput.focus();
  }
}

// Health check on load
fetch('/health')
  .then(r => r.json())
  .then(() => { statusDot.classList.remove('offline'); })
  .catch(() => { statusDot.classList.add('offline'); });

// Pick up demo params from URL hash (e.g. #student=1001&topic=DS&q=hello)
if (window.location.hash) {
  try {
    const params = new URLSearchParams(window.location.hash.slice(1));
    if (params.get('student')) document.getElementById('user-id').value = params.get('student');
    if (params.get('topic')) document.getElementById('topic').value = params.get('topic');
    if (params.get('q')) {
      msgInput.value = params.get('q');
      msgInput.focus();
    }
    // Clear hash so refreshing doesn't re-trigger
    history.replaceState(null, '', '/');
  } catch (e) { /* ignore parse errors */ }
}
</script>
</body>
</html>
